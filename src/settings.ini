# ════════════════════════════════════════════════════════════════════
#  AD Computer Management Tool — settings.ini
#  v4.0 — Enterprise Configuration
#
#  ⚠️  ეს ფაილი მხოლოდ IT Admin-ს უნდა შეცვლოს.
#      GPO-ს გამოყენებით შესაძლებელია centralized deployment.
#
#  გასაღები:  ADRENAME_HMAC_KEY  (env variable)
#  Deploy via GPO: Computer Configuration > Preferences > Environment
#                  Name: ADRENAME_HMAC_KEY
#                  Value: <base64-encoded 32-byte key>
#  Key გენერაცია:
#    PS> $k = [Convert]::ToBase64String((1..32|%{[byte](Get-Random -Max 256)}))
#    PS> [System.Environment]::SetEnvironmentVariable('ADRENAME_HMAC_KEY', $k, 'Machine')
# ════════════════════════════════════════════════════════════════════

[scan]
# OU search base — ცარიელი = მთელი domain (არარეკომენდირებული დიდ domain-ებზე)
# მაგ: OU=Workstations,DC=corp,DC=local
ad_search_base =

# Inactive computer filter — 0 = disabled
# კომპიუტერები, რომლებიც X დღეზე მეტია offline, გაფილტვრება
ad_filter_inactive_days = 90

# SMB thread count — EDR-თან თავსებადობისთვის შეინახეთ <= 50
# ↑ = სწრაფი სკანი, ↑ EDR alert რისკი
# ↓ = ნელი სკანი, ↓ EDR alert რისკი
smb_threads = 50

# WMI thread count — თითოეული ~5-20MB RAM-ს ხარჯავს
# 50 threads: ~1000 online PC → ~20 rounds × wmi_timeout
wmi_threads = 50

# Socket connection timeout (seconds) — 0.10-0.30 recommended
socket_timeout = 0.15

# WMI operation timeout (seconds)
wmi_timeout = 5

# Watcher re-check interval (seconds) — offline PC-ების შემოწმება
watch_interval = 60


[security]
# გადარქმევამდე confirmation dialog
require_confirmation = true

# მომხმარებელს შეატყობინოს გადარქმევამდე (msg.exe)
notify_user_before_rename = true

# Grace period seconds — notification-დან rename-მდე
# 0 = დაუყოვნებლივ
notification_grace_seconds = 60

# Domain Controller-ის rename-ის დაბლოკვა
# false = production-ში არ გამოიყენოთ!
check_dc_role = true

# AD-ში duplicate სახელის შემოწმება rename-ამდე
check_duplicate_name = true

# SPN (HOST, WSMAN) განახლება rename-ის შემდეგ
update_spns_after_rename = true

# Reboot-ის გამოტოვებისას split-brain გაფრთხილება
warn_on_reboot_skip = true


[audit]
# Windows Application Event Log ჩაწერა
write_event_log = true

# Event Log source name (Event Viewer-ში ჩანს)
event_log_source = AD-Rename-Tool

# Environment variable name for HMAC key
# ყოველთვის გამოაყენეთ GPO-ს მეშვეობით deploy
hmac_key_env = ADRENAME_HMAC_KEY

# GDPR / Data Retention — Fix MEDIUM-005
# audit.log max age (days) — 0 = no rotation
# GDPR Article 5(1)(e): data kept no longer than necessary
audit_log_retention_days = 365

# Scan CSV max age (days) — 0 = no rotation
scan_retention_days = 90

# Anonymize usernames in old log entries after X days (0 = disabled)
# Replaces DOMAIN\username with DOMAIN\[redacted] in rotated archives
anonymize_after_days = 180


[paths]
# ცარიელი = data/ ფოლდერი exe-ს გვერდით
# სხვა: C:\ProgramData\ADRenameTool\logs
data_dir =
audit_log  = audit.log
cache_file = scan_cache.json
scans_folder = scans
